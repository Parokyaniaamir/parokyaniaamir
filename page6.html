<html>
<head>
<title>Tom and Jerry</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: lightblue;
    background-image: url("tom-and-jerry.jpg");
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-position: center;
    background-size: cover;
}

h1 {
    text-align: center;
    background-color: yellow;
    color: blue;
    padding: 25px;
}

.box {
    width: 70%;
    margin: 40px auto;
    padding: 25px;
    background-color: white;
    border: 5px solid blue;
    border-radius: 15px;
}

h2 {
    color: darkblue;
}

p {
    font-size: 18px;
}

</style>
</head>

<body>

<h1>Tom and Jerry</h1>

<div class="box">

<h2>About Tom and Jerry</h2>

<p>
Tom and Jerry is a funny cartoon about Tom, a cat,
and Jerry, a clever mouse. They are always chasing
and tricking each other.
</p>

<h2>Tom</h2>

<p>
Tom is a cat who always tries to catch Jerry.
</p>

<h2>Jerry</h2>

<p>
Jerry is a smart mouse who always escapes from Tom.
</p>

</div>

</body>
</html>
